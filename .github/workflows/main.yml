
name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Android SDK atualizado
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build web (Vite)
        run: npm run build

      - name: Criar projeto Android (Capacitor)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Aplicar ícones e versão
        run: |
          RES=android/app/src/main/res

          # Copiar recursos personalizados, se existirem
          if [ -d android-res ]; then
            cp -R android-res/. "$RES/"
          fi

          mkdir -p "$RES/values"

          # Configurar versão
          VERSION=$(node -p "require('./package.json').version")

          sed -i -E \
            "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]+\"/versionName \"${VERSION}\"/" \
            android/app/build.gradle

          # Configurar ícone adaptativo apenas se existir primeiro plano
          if find "$RES" -path '*/ic_launcher_foreground.*' | grep -q .; then

            mkdir -p "$RES/mipmap-anydpi-v26"

            cat > "$RES/values/ic_launcher_background.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#1D4ED8</color>
          </resources>
          XML

            cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML

            cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" \
               "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          fi

      - name: Gerar APK Debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Decodificar keystore
        id: ks
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar APK Release assinado
        if: steps.ks.outputs.ok == 'true'
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="${KEY_PASS:-$KS_PASS}"

      - name: Reunir APKs
        run: |
          mkdir -p out

          cp android/app/build/outputs/apk/debug/app-debug.apk \
             out/Teclado-Umbundu-debug.apk

          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk \
               out/Teclado-Umbundu-release.apk
          fi

          ls -lh out

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Teclado-Umbundu-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar APK em Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk

